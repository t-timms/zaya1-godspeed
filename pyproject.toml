[project]
name = "zaya1-godspeed"
version = "0.3.1"
description = "Completing ZAYA1-8B with agentic multi-turn tool calling via teacher-distilled SFT+GRPO. DeepSeek V4 Pro teacher, Godspeed harness, Unsloth + TRL."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
readme = "README.md"
dependencies = [
    "torch>=2.5.0",
    "accelerate>=1.0.0",
    "transformers @ git+https://github.com/Zyphra/transformers.git@zaya1",
    "peft>=0.13.0",
    "bitsandbytes>=0.45.0",
    "trl>=0.24.0",
    "datasets>=3.0.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "mcp>=1.27.1",
]
inference = [
    "vllm @ git+https://github.com/Zyphra/vllm.git@zaya1-pr",
]
speed = [
    "unsloth>=2026.5.0",
    "liger-kernel>=0.6.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportPrivateUsage = false

[tool.coverage.report]
omit = ["tests/*"]
