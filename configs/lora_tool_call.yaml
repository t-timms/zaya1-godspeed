# QLoRA fine-tuning config for ZAYA1-8B tool-calling
# Targeted at the agentic weakness: structured multi-step tool use
# Targets attention projections only — not expert weights

# ── Model ──────────────────────────────────────────────────────
model:
  name_or_path: "Zyphra/ZAYA1-8B"
  trust_remote_code: true
  torch_dtype: "bfloat16"

# ── Quantization ───────────────────────────────────────────────
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: false

# ── LoRA ───────────────────────────────────────────────────────
lora:
  r: 16
  lora_alpha: 32
  target_modules:
    - "o_proj"       # attention output projection
    - "linear_q"     # query projection
    - "linear_k"     # key projection
    - "val_proj1"    # value projection 1 (CCA)
    - "val_proj2"    # value projection 2 (CCA)
  lora_dropout: 0.05
  bias: "none"

# ── Training ───────────────────────────────────────────────────
training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  num_train_epochs: 3
  max_seq_length: 4096
  gradient_checkpointing: true
  fp16: false
  bf16: true
  optim: "adamw_8bit"
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  save_total_limit: 3

# ── VRAM estimate (16 GB GPU) ─────────────────────────────────
# NF4 model:         ~7.2 GB
# LoRA adapters:     ~0.0 GB
# Optimizer states:  ~0.3 GB (8-bit Adam)
# Gradients:         ~0.3 GB
# Activations:       ~2-4 GB (with gradient checkpointing)
# Total:             ~10-12 GB  ✓ fits on 16 GB
